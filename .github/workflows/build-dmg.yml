name: Construire le .dmg macOS

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon (M1/M2/M3/M4)
          - runner: macos-15-intel  # Mac Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests du pont
        timeout-minutes: 5
        run: |
          pip install -r bridge/requirements.txt
          python -m py_compile addin/Fusion3DVR/Fusion3DVR.py bridge/fusion3d_bridge.py
          python -u tests/test_bridge.py
      - name: Construire le .dmg
        run: ./packaging/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Fusion3D-VR-${{ matrix.runner }}
          path: dist/*.dmg
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
